# Review-only staging TLS edge; NOT included in infra/deploy.sh.
# Requires separately approved staging provisioning and certificate mounts.
# Run only after approval with:
# docker compose -f docker-compose.prod.yml -f infra/staging/edge.compose.yml -p pmo-staging --env-file .env.staging config
services:
  staging-edge:
    image: nginx:1.28-alpine # Pin an approved patched digest before deployment.
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    ports:
      # Loopback by default. Public exposure requires separate change approval.
      - "${STAGING_EDGE_BIND:-127.0.0.1}:${STAGING_EDGE_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./infra/staging/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${STAGING_TLS_CERT_PATH:?set approved staging certificate path}:/run/epmo-tls/tls.crt:ro
      - ${STAGING_TLS_KEY_PATH:?set approved staging private key path}:/run/epmo-tls/tls.key:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,nosuid,size=16m,mode=1777
      - /var/run:rw,nosuid,size=4m,mode=1777
      - /tmp:rw,nosuid,noexec,size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Root master reads 0600 host-mounted TLS key; workers drop to nginx.
    cap_add: [SETUID, SETGID]
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/edge-health']
      interval: 20s
      timeout: 4s
      start_period: 15s
      retries: 3
