# This file is mounted into the nginx http context (conf.d/default.conf).
# Only the edge is published. API remains private to Docker, preserving
# scripts/phase16d-verify-staging-api.mjs's no-host-port security assertion.
resolver 127.0.0.11 valid=10s ipv6=off;
server_tokens off;
map $http_upgrade $epmo_connection_upgrade {
  default upgrade;
  '' close;
}

# In-container liveness only. Not published on the host.
server {
  listen 8080;
  server_name _;
  access_log off;
  location = /edge-health {
    default_type text/plain;
    return 200 "ok";
  }
  location / { return 404; }
}

# Unknown Host must never fall through to the authenticated web application.
server {
  listen 8443 ssl default_server;
  server_name _;
  ssl_certificate /run/epmo-tls/tls.crt;
  ssl_certificate_key /run/epmo-tls/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  return 421;
}

server {
  listen 8443 ssl;
  server_name staging.theepmo.com;
  ssl_certificate /run/epmo-tls/tls.crt;
  ssl_certificate_key /run/epmo-tls/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 20m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location / {
    # Variables force Docker DNS re-resolution after api/web recreation.
    set $epmo_web_upstream web:3000;
    proxy_pass http://$epmo_web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    # Replace, do not append, client-provided forwarded headers.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $epmo_connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
  }
}

server {
  listen 8443 ssl;
  server_name api-staging.theepmo.com;
  ssl_certificate /run/epmo-tls/tls.crt;
  ssl_certificate_key /run/epmo-tls/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 20m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location / {
    set $epmo_api_upstream api:4000;
    proxy_pass http://$epmo_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
  }
}
