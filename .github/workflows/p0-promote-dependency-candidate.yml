name: P0 audited dependency promotion (review branch only)
on:
  push:
    branches: [fix/p0-dependency-promotion-20261030]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  promote:
    if: github.repository == 'faisalwrokksa-hub/THEEPMOTEST' && github.ref == 'refs/heads/fix/p0-dependency-promotion-20261030' && github.event.head_commit.message != 'chore(deps): promote audited CI candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Require exact source provenance and unchanged manifests
        run: |
          test "$(git branch --show-current)" = 'fix/p0-dependency-promotion-20261030'
          git cat-file -e 68489f8ccae66d4956ecb712e48226b6b03d9db6^{commit}
          test "$(git diff --name-only 68489f8ccae66d4956ecb712e48226b6b03d9db6 HEAD)" = '.github/workflows/p0-promote-dependency-candidate.yml'
          test -z "$(git status --porcelain)"
      - name: Download pinned same-source candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/epmo-promotion"
          curl --fail --location --silent --show-error --retry 2 --retry-delay 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/faisalwrokksa-hub/THEEPMOTEST/actions/artifacts/12942098738/zip" \
            --output "$RUNNER_TEMP/epmo-promotion/candidate.zip"
          echo 'f6334ac5951ff1d5a11198ccd70712c166d26b7c44f776313ada24a9e717778b  '"$RUNNER_TEMP/epmo-promotion/candidate.zip" | sha256sum --check
          node scripts/prepare-dependency-promotion.mjs "$RUNNER_TEMP/epmo-promotion/candidate.zip" f6334ac5951ff1d5a11198ccd70712c166d26b7c44f776313ada24a9e717778b --apply "$GITHUB_WORKSPACE"
      - name: Verify frozen lockfile, high/critical audit and builds before commit
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level high
          pnpm build:packages
          pnpm --filter @pmo/api build
          pnpm typecheck
          pnpm --filter @pmo/web build
          node scripts/verify-build-artifacts.mjs --scope all
      - name: Commit only the seven audited candidate files to review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pnpm-lock.yaml pnpm-workspace.yaml package.json apps/api/package.json apps/web/package.json packages/contracts/package.json packages/db/package.json
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git diff --cached --check
          git commit -m 'chore(deps): promote audited CI candidate'
          git push origin HEAD:refs/heads/fix/p0-dependency-promotion-20261030
