name: EPMO CI build and RLS verification
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-db:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: epmo_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d epmo_ci"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      CI: 'true'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: epmo_ci
      PGPASSWORD: postgres_ci_only
      DATABASE_URL: postgresql://pmo_app:pmo_ci_app_password_only@127.0.0.1:5432/epmo_ci
      DATABASE_URL_ADMIN: postgresql://postgres:postgres_ci_only@127.0.0.1:5432/epmo_ci
      PHASE15_ACCEPT_DISPOSABLE_DB: YES_RESEED_DISPOSABLE_TEST_DATABASE
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.17.0'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate static release and migration chain
        run: |
          pnpm verify:static
          pnpm verify:migrations
      - name: Build and TypeScript check
        run: |
          pnpm build
          pnpm typecheck
      - name: Provision CI-only restricted PostgreSQL role
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE pmo_app LOGIN PASSWORD 'pmo_ci_app_password_only' NOBYPASSRLS NOSUPERUSER NOCREATEDB NOCREATEROLE;
          SQL
      - name: Apply SQL migrations to disposable PostgreSQL
        run: pnpm db:migrate
      - name: Enforce RLS policies on disposable PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f packages/db/sql/rls.sql
      - name: Seed explicitly acknowledged disposable test database
        run: pnpm db:seed
      - name: Verify PostgreSQL row-level security
        run: pnpm verify:rls
      - name: Run offline regression suite
        run: pnpm test:offline
